name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project if uploaded as zip
        run: |
          if [ -f AirString-android.zip ]; then unzip -o -q AirString-android.zip; fi
          if [ -d AirString/app ]; then echo "PROJ=AirString" >> $GITHUB_ENV; else echo "PROJ=." >> $GITHUB_ENV; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AirString-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
